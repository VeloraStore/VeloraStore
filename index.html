<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velora – Modern Store</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f7f7f8;--fg:#1f2326;--card:#fff;--bd:#e5e7eb;--mut:#6b7280;--ac:#059669;--ac2:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111315;--fg:#eceef0;--card:#1b1e21;--bd:#2c3034;--mut:#9ca3af}}
:root[data-theme="dark"]{--bg:#111315;--fg:#eceef0;--card:#1b1e21;--bd:#2c3034;--mut:#9ca3af}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;transition:.2s}
.card:hover.hv{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:.6rem;padding:.55rem .75rem;color:var(--fg)}
.inp.bad{border-color:#dc2626;background:#dc26260d}
.btn{background:var(--ac);color:#fff;border-radius:.7rem;padding:.6rem 1.1rem;font-weight:600;transition:.2s}.btn:hover{filter:brightness(1.1)}
.btn2{background:var(--ac2)}.ghost{border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.chip{border:1px solid var(--bd);border-radius:.6rem;padding:.3rem .7rem;cursor:pointer}.chip.on{border-color:var(--ac2);background:var(--ac2);color:#fff}
.mut{color:var(--mut)}
#drawer{transition:transform .3s}
</style>
</head>
<body>
<!-- HEADER -->
<header class="sticky top-0 z-30 border-b" style="background:var(--card);border-color:var(--bd);top:0">
 <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
  <a href="#home" onclick="go('home')" class="text-2xl font-extrabold tracking-tight" style="color:var(--ac)">Velora</a>
  <nav class="hidden md:flex gap-5 ml-6 text-sm font-medium">
   <a href="#home" onclick="go('home')">Home</a><a href="#shop" onclick="go('shop')">Shop</a><a href="#orders" onclick="go('orders')">Orders</a>
  </nav>
  <input id="q" oninput="onSearch(this.value)" placeholder="Search products, tags…" class="inp ml-auto max-w-xs">
  <button onclick="toggleTheme()" class="ghost btn px-3" aria-label="Theme">◐</button>
  <button onclick="drawer(true)" class="btn relative">Cart <span id="cc" class="ml-1 bg-white/25 rounded-full px-2 text-xs">0</span></button>
 </div>
 <nav class="md:hidden flex gap-5 px-4 pb-2 text-sm font-medium"><a href="#home" onclick="go('home')">Home</a><a href="#shop" onclick="go('shop')">Shop</a><a href="#orders" onclick="go('orders')">Orders</a></nav>
</header>
<main id="app" class="max-w-7xl mx-auto px-4 py-6 min-h-[70vh]"></main>
<footer class="text-center text-sm mut py-8 border-t" style="border-color:var(--bd)">© 2026 Velora · Free delivery over Rs. 5,000 · </footer>

<!-- CART DRAWER -->
<div id="ov" onclick="drawer(false)" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md z-50 translate-x-full flex flex-col" style="background:var(--card)">
 <div class="p-4 border-b flex justify-between items-center" style="border-color:var(--bd)"><b class="text-lg">Your Cart</b><button onclick="drawer(false)" class="text-2xl">×</button></div>
 <div id="dbody" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
 <div id="dfoot" class="p-4 border-t" style="border-color:var(--bd)"></div>
</aside>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white px-4 py-2 rounded-full text-sm hidden"></div>

<script>
/* ===== DATA & LOCALSTORAGE SYNC ===== */
const CATS=['Electronics','Fashion','Home & Living','Beauty','Fitness','Accessories'];
const GRAD={Electronics:['#6366f1','#22d3ee'],Fashion:['#f472b6','#fb923c'],'Home & Living':['#34d399','#a3e635'],Beauty:['#f9a8d4','#c084fc'],Fitness:['#f59e0b','#ef4444'],Accessories:['#64748b','#0ea5e9']};

// Your Business WhatsApp Number & Admin Password
const BUSINESS_WHATSAPP = '923102179996';
const ADMIN_PASSWORD = 'abc123abc';

const INITIAL_RAW=`Wireless Earbuds Pro|Electronics|12900|4.6|🎧|audio,wireless,music|0|https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&auto=format&fit=crop&q=60
Smart Watch S2|Electronics|18500|4.4|⌚|wearable,fitness,watch|0|https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60
Portable Bluetooth Speaker|Electronics|7500|4.5|🔊|audio,wireless,party|0|https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500&auto=format&fit=crop&q=60
20K Power Bank|Electronics|4200|4.3|🔋|charging,travel,phone|0|https://images.unsplash.com/photo-1609592424104-97d4c4f74d0a?w=500&auto=format&fit=crop&q=60
Linen Summer Shirt|Fashion|3800|4.2|👕|shirt,casual,summer|0|https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500&auto=format&fit=crop&q=60
Denim Jacket|Fashion|7900|4.5|🧥|jacket,denim,winter|0|https://images.unsplash.com/photo-1576995853123-5a10305d93c0?w=500&auto=format&fit=crop&q=60
Classic Sneakers|Fashion|8900|4.7|👟|shoes,casual,sport|0|https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60
Merino Wool Scarf|Fashion|2200|4.1|🧣|winter,scarf,gift|0|https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=500&auto=format&fit=crop&q=60
Ceramic Vase Set|Home & Living|3400|4.4|🏺|decor,gift,vase|0|https://images.unsplash.com/photo-1581783342654-28b7e25a2b9f?w=500&auto=format&fit=crop&q=60
Aroma Diffuser|Home & Living|3900|4.6|🕯️|relax,scent,decor|0|https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=500&auto=format&fit=crop&q=60
Cotton Throw Blanket|Home & Living|4600|4.5|🛋️|cozy,winter,decor|0|https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=500&auto=format&fit=crop&q=60
LED Desk Lamp|Home & Living|3100|4.3|💡|office,light,study|0|https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500&auto=format&fit=crop&q=60
Vitamin C Serum|Beauty|2800|4.6|🧴|skincare,glow,serum|0|https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500&auto=format&fit=crop&q=60
Hydrating Moisturizer|Beauty|2400|4.4|🧼|skincare,daily,cream|0|https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500&auto=format&fit=crop&q=60
Matte Lip Kit|Beauty|1900|4.0|💄|makeup,lips,gift|0|https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=500&auto=format&fit=crop&q=60
Argan Hair Oil|Beauty|2100|4.2|🌿|hair,care,natural|0|https://images.unsplash.com/photo-1608248597359-97424d19335e?w=500&auto=format&fit=crop&q=60
Yoga Mat Pro|Fitness|3600|4.7|🧘|yoga,mat,home-workout|0|https://images.unsplash.com/photo-1601925260368-ae2f83cf8b7f?w=500&auto=format&fit=crop&q=60
Adjustable Dumbbells|Fitness|14500|4.5|🏋️|weights,strength,home-workout|0|https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?w=500&auto=format&fit=crop&q=60
Resistance Bands Set|Fitness|1700|4.3|🎽|bands,stretch,home-workout|0|https://images.unsplash.com/photo-1598289431512-b97b09177c6e?w=500&auto=format&fit=crop&q=60
Insulated Bottle 750ml|Fitness|1900|4.6|🧊|bottle,gym,travel|0|https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500&auto=format&fit=crop&q=60
Leather Wallet|Accessories|3300|4.5|👛|wallet,leather,gift|0|https://images.unsplash.com/photo-1627123424574-724758594e93?w=500&auto=format&fit=crop&q=60
Polarized Sunglasses|Accessories|4800|4.2|🕶️|sun,summer,style|0|https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&auto=format&fit=crop&q=60
Canvas Backpack|Accessories|5600|4.6|🎒|bag,travel,study|0|https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60
Phone Case Duo|Accessories|1500|3.9|📱|phone,case,protection|0|https://images.unsplash.com/photo-1601593346740-925623e07929?w=500&auto=format&fit=crop&q=60`;

const ls={
 get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let P = ls.get('velora_products', INITIAL_RAW.split('\n').map((l,i)=>{
 const [n,c,p,r,e,t,s,img]=l.split('|');
 return {id:i+1, n, c, p:+p, r:+r, e, t:t.split(','), sold:0, rv:0, stock:15, sizes:c==='Fashion'?['S','M','L','XL']:null, d:`${n} — crafted for everyday use with premium materials.`, img:img||''};
}));

let cart=ls.get('velora_cart',[]), orders=ls.get('velora_orders',[]), promo=ls.get('velora_promo',null);
let F={cat:'All',min:0,max:20000,rate:0,sort:'feat',q:''}, view={n:'home',a:null}, sel={};

const saveProducts=()=>ls.set('velora_products',P);
const saveCart=()=>{ls.set('velora_cart',cart);ls.set('velora_promo',promo);$('#cc').textContent=cart.reduce((s,i)=>s+i.q,0);renderDrawer()};
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),1800)};
const toggleTheme=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#111315';r.dataset.theme=dark?'light':'dark'};
const byId=id=>P.find(p=>p.id==id);
const fmt=n=>'Rs. '+Math.round(n).toLocaleString('en-PK');
const PROMOS={VELORA10:.10,WELCOME20:.20};

/* ===== ROUTER & ADMIN GATE ===== */
function go(n,a=null){
 if(n==='admin'){renderAdmin();return;}
 view={n,a};try{location.hash=n==='pdp'?'p'+a:n}catch(e){}drawer(false);render();scrollTo(0,0)
}

function fromHash(){
 const h=(location.hash||'').slice(1);
 if(h.startsWith('admin-velorasecure999')){
  if(sessionStorage.getItem('velora_admin_auth')==='true'){
   view={n:'admin',a:null}; renderAdmin();
  } else {
   view={n:'admin_login',a:null}; renderAdminLogin();
  }
 } else if(/^p\d+$/.test(h)){
  view={n:'pdp',a:+h.slice(1)}; render();
 } else if(/^success-/.test(h)){
  view={n:'success',a:h.replace('success-','')}; render();
 } else if(['home','shop','checkout','orders'].includes(h)){
  view={n:h,a:null}; render();
 } else {
  view={n:'home',a:null}; render();
 }
}
addEventListener('hashchange',()=>{fromHash()});
function render(){
 if(view.n==='admin'||view.n==='admin_login')return;
 ({home:vHome,shop:vShop,pdp:vPdp,checkout:vCheckout,success:()=>vSuccess(view.a),orders:vOrders})[view.n]();
}

/* ===== COMPONENTS ===== */
const tile=(p,cls='h-44',big=false,ang=135)=>{
 const[a,b]=GRAD[p.c]||['#6366f1','#22d3ee'];
 if(p.img && p.img.trim()!==''){
  return `<div class="${cls} rounded-xl overflow-hidden flex items-center justify-center bg-gray-100"><img src="${p.img}" alt="${p.n}" class="w-full h-full object-cover"></div>`;
 }
 return `<div class="${cls} rounded-xl flex items-center justify-center ${big?'text-8xl':'text-6xl'}" style="background:linear-gradient(${ang}deg,${a},${b})">${p.e||'📦'}</div>`;
};
const stars=r=>`<span class="text-amber-500">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}</span> <span class="text-xs mut">${r.toFixed(1)}</span>`;
const stockTag=p=>p.stock===0?'<span class="text-red-600 text-sm">Out of stock</span>':p.stock<=5?`<span class="text-amber-600 text-sm">Only ${p.stock} left</span>`:'<span class="text-sm" style="color:var(--ac)">In stock</span>';
const cardHtml=p=>`<div class="card hv p-3 flex flex-col"><div class="cursor-pointer" onclick="go('pdp',${p.id})">${tile(p)}<div class="mt-3 text-xs mut">${p.c}</div><div class="font-semibold leading-tight">${p.n}</div><div class="mt-1">${stars(p.r)}</div></div>
<div class="mt-auto pt-3 flex items-center justify-between"><b>${fmt(p.p)}</b><button class="btn text-sm" ${p.stock?'':'disabled style="opacity:.4"'} onclick="quickAdd(${p.id})">+ Add</button></div></div>`;

/* ===== VIEWS ===== */
function vHome(){
 const feat=[...P].slice(0,8);
 $('#app').innerHTML=`
 <section class="rounded-3xl p-8 md:p-14 text-white" style="background:linear-gradient(120deg,#065f46,#4f46e5)">
  <p class="uppercase tracking-widest text-xs opacity-80">Store Collection</p>
  <h1 class="text-4xl md:text-6xl font-extrabold mt-2 max-w-xl">Quality products for everyday life.</h1>
  <p class="mt-3 max-w-md opacity-90">Use code <b>VELORA10</b> or <b>WELCOME20</b> at checkout.</p>
  <button class="mt-6 bg-white text-gray-900 font-semibold rounded-xl px-6 py-3" onclick="F.cat='All';go('shop')">Shop the collection</button>
 </section>
 <h2 class="text-xl font-bold mt-10 mb-4">Categories</h2>
 <div class="grid grid-cols-2 md:grid-cols-6 gap-3">${CATS.map(c=>`<button onclick="F.cat='${c}';go('shop')" class="card hv p-4 text-center"><div class="h-14 rounded-lg mb-2" style="background:linear-gradient(135deg,${GRAD[c][0]},${GRAD[c][1]})"></div><b class="text-sm">${c}</b></button>`).join('')}</div>
 <h2 class="text-xl font-bold mt-10 mb-4">Featured products</h2>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-4">${feat.map(cardHtml).join('')}</div>`;
}

function filtered(){
 const q=F.q.toLowerCase().trim();
 let r=P.filter(p=>(F.cat==='All'||p.c===F.cat)&&p.p>=F.min&&p.p<=F.max&&p.r>=F.rate&&(!q||(p.n+p.d+p.t.join(' ')+p.c).toLowerCase().includes(q)));
 const s={lh:(a,b)=>a.p-b.p,hl:(a,b)=>b.p-a.p,new:(a,b)=>b.id-a.id,best:(a,b)=>b.sold-a.sold,feat:(a,b)=>b.r-a.r}[F.sort];
 return r.sort(s);
}
function vShop(){
 $('#app').innerHTML=`<div class="grid md:grid-cols-[250px_1fr] gap-6">
 <aside class="card p-4 h-fit space-y-5 text-sm">
  <div><b>Category</b><div class="mt-2 flex flex-wrap gap-2">${['All',...CATS].map(c=>`<span class="chip ${F.cat===c?'on':''}" onclick="F.cat='${c}';vShop()">${c}</span>`).join('')}</div></div>
  <div><b>Price range</b><div class="mt-2 mut" id="pl">${fmt(F.min)} – ${fmt(F.max)}</div>
   <input type="range" min="0" max="20000" step="100" value="${F.min}" oninput="F.min=Math.min(+this.value,F.max);pl()" class="w-full accent-indigo-600">
   <input type="range" min="0" max="20000" step="100" value="${F.max}" oninput="F.max=Math.max(+this.value,F.min);pl()" class="w-full accent-indigo-600"></div>
  <div><b>Rating</b><div class="mt-2 flex gap-2">${[0,3,4].map(r=>`<span class="chip ${F.rate===r?'on':''}" onclick="F.rate=${r};vShop()">${r?r+'★ & up':'Any'}</span>`).join('')}</div></div>
  <button class="ghost btn w-full" onclick="F={cat:'All',min:0,max:20000,rate:0,sort:'feat',q:''};$('#q').value='';vShop()">Reset filters</button>
 </aside>
 <section><div class="flex items-center justify-between mb-4"><span id="rc" class="mut text-sm"></span>
  <select class="inp !w-auto" onchange="F.sort=this.value;grid()">${[['feat','Featured'],['lh','Price: Low to High'],['hl','Price: High to Low'],['new','Newest Arrivals'],['best','Best Sellers']].map(([v,l])=>`<option value="${v}" ${F.sort===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div id="grid" class="grid grid-cols-2 lg:grid-cols-3 gap-4"></div></section></div>`;
 grid();
}
const pl=()=>{$('#pl').textContent=fmt(F.min)+' – '+fmt(F.max);grid()};
function grid(){const r=filtered();$('#rc').textContent=r.length+' products';$('#grid').innerHTML=r.length?r.map(cardHtml).join(''):'<p class="mut col-span-full py-12 text-center">No products match your filters.</p>'}
function onSearch(v){F.q=v;if(view.n!=='shop')go('shop');else grid()}

function vPdp(){
 const p=byId(view.a); if(!p)return go('shop');
 sel={color:'Charcoal',size:p.sizes?'M':null,qty:1};
 $('#app').innerHTML=`<a class="text-sm mut cursor-pointer" onclick="go('shop')">← Back to shop</a>
 <div class="grid md:grid-cols-2 gap-8 mt-3">
  <div><div id="main">${tile(p,'h-96',true)}</div></div>
  <div><div class="text-xs mut">${p.c}</div><h1 class="text-3xl font-bold">${p.n}</h1><div class="mt-1">${stars(p.r)}</div>
   <div class="text-3xl font-extrabold mt-3">${fmt(p.p)}</div><div class="mt-1">${stockTag(p)}</div><p class="mut mut-3">${p.d}</p>
   ${p.sizes?`<div class="mt-3"><b class="text-sm">Size</b><div class="flex gap-2 mt-1" id="sz">${p.sizes.map(s=>`<span class="chip ${s==='M'?'on':''}" onclick="pick('size','${s}',this)">${s}</span>`).join('')}</div></div>`:''}
   <div class="flex gap-3 mt-5 items-center"><div class="flex items-center card px-2"><button class="px-2 text-xl" onclick="sel.qty=Math.max(1,sel.qty-1);$('#qv').textContent=sel.qty">−</button><span id="qv" class="w-6 text-center">1</span><button class="px-2 text-xl" onclick="sel.qty=Math.min(10,sel.qty+1);$('#qv').textContent=sel.qty">+</button></div>
   <button class="btn flex-1 py-3" ${p.stock?'':'disabled style="opacity:.4"'} onclick="addCart(${p.id},sel.color,sel.size,sel.qty,true)">Add to cart</button></div>
  </div></div>`;
}
function pick(k,v,el){sel[k]=v;[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on')}

/* ===== CART & CHECKOUT ===== */
const quickAdd=id=>addCart(id,'Charcoal',byId(id).sizes?'M':null,1,true);
function addCart(id,color,size,q,open){
 const k=[id,color,size].join('|'),ex=cart.find(i=>i.k===k);
 if(ex)ex.q=Math.min(10,ex.q+q);else cart.push({k,id,color,size,q});
 saveCart();toast(byId(id).n+' added');if(open)drawer(true);
}
function qty(k,d){const i=cart.find(x=>x.k===k);i.q+=d;if(i.q<=0)cart=cart.filter(x=>x.k!==k);saveCart();if(view.n==='checkout')vCheckout()}
function totals(){
 const sub=cart.reduce((s,i)=>s+byId(i.id).p*i.q,0),disc=promo?sub*PROMOS[promo]:0,ship=!cart.length||sub-disc>=5000?0:250;
 return{sub,disc,ship,total:sub-disc+ship};
}
function applyPromo(){const c=$('#pc').value.trim().toUpperCase();if(PROMOS[c]){promo=c;toast(c+' applied');}else{promo=null;toast('Invalid promo code')}saveCart();if(view.n==='checkout')vCheckout()}
function drawer(open){$('#drawer').classList.toggle('translate-x-full',!open);$('#ov').classList.toggle('hidden',!open)}
const lineHtml=i=>{const p=byId(i.id);return p?`<div class="flex gap-3 items-center"><div class="w-16">${tile(p,'h-16')}</div><div class="flex-1 text-sm"><b>${p.n}</b><div class="mut text-xs">${i.color}${i.size?' · '+i.size:''}</div><div>${fmt(p.p*i.q)}</div></div><div class="flex items-center gap-1"><button class="chip" onclick="qty('${i.k}',-1)">−</button><span class="w-5 text-center">${i.q}</span><button class="chip" onclick="qty('${i.k}',1)">+</button></div></div>`:''};
const sumHtml=t=>`<div class="text-sm space-y-1"><div class="flex justify-between"><span class="mut">Subtotal</span>${fmt(t.sub)}</div>${t.disc?`<div class="flex justify-between" style="color:var(--ac)"><span>Promo ${promo}</span>−${fmt(t.disc)}</div>`:''}<div class="flex justify-between"><span class="mut">Shipping</span>${t.ship?fmt(t.ship):'Free'}</div><div class="flex justify-between text-lg font-bold pt-1"><span>Total</span>${fmt(t.total)}</div></div>`;
function renderDrawer(){
 const t=totals();
 $('#dbody').innerHTML=cart.length?cart.map(lineHtml).join(''):'<p class="mut text-center mt-10">Your cart is empty.</p>';
 $('#dfoot').innerHTML=cart.length?`<div class="flex gap-2 mb-3"><input id="pc" class="inp" placeholder="Promo code" value="${promo||''}"><button class="ghost btn" onclick="applyPromo()">Apply</button></div>${sumHtml(t)}<button class="btn w-full mt-3 py-3" onclick="go('checkout')">Checkout</button>`:'';
}

let pay='cod';
function vCheckout(){
 if(!cart.length){$('#app').innerHTML='<div class="text-center py-20"><p class="mut">Your cart is empty.</p><button class="btn mt-4" onclick="go(\'shop\')">Go shopping</button></div>';return}
 const t=totals(),f=(id,l,ph='',ex='')=>`<label class="block text-sm">${l}<input id="${id}" class="inp mt-1" placeholder="${ph}" ${ex}></label>`;
 $('#app').innerHTML=`<h1 class="text-2xl font-bold mb-4">Secure checkout</h1><div class="grid md:grid-cols-[1fr_340px] gap-6">
 <div class="space-y-5">
  <section class="card p-5"><h2 class="font-bold mb-3">1. Delivery details</h2><div class="grid sm:grid-cols-2 gap-3">${f('fn','Full name','Muhammad Ali','required')}${f('ph','Phone','03xx-xxxxxxx','required')}${f('em','Email','you@example.com')}${f('ct','City','Karachi','required')}<div class="sm:col-span-2">${f('ad','Street address & area','House, street, society name','required')}</div></div></section>
  <section class="card p-5"><h2 class="font-bold mb-3">2. Payment method</h2>
   <div class="flex flex-wrap gap-2 mb-4">${[['cod','Cash on Delivery (COD)'],['ep','Easypaisa / JazzCash'],['card','Credit / Debit Card']].map(([v,l])=>`<span class="chip ${pay===v?'on':''}" onclick="pay='${v}';payUI()">${l}</span>`).join('')}</div>
   <div id="pdetails" class="text-sm mut">Pay with cash upon safe doorstep delivery.</div>
  </section>
 </div>
 <div class="card p-5 h-fit space-y-4">
  <h2 class="font-bold">Order Summary</h2>
  <div class="max-h-48 overflow-y-auto space-y-2">${cart.map(i=>{const p=byId(i.id);return `<div class="flex justify-between text-sm"><span>${p.n} × ${i.q}</span><b>${fmt(p.p*i.q)}</b></div>`}).join('')}</div>
  <hr style="border-color:var(--bd)">
  ${sumHtml(t)}
  <button class="btn w-full py-3 mt-2" onclick="placeOrder()">Place Order</button>
 </div></div>`;
 payUI();
}
function payUI(){
 const d=$('#pdetails');
 if(!d)return;
 if(pay==='cod')d.textContent='Pay with cash upon safe doorstep delivery.';
 if(pay==='ep')d.textContent='Transfer funds to Easypaisa account: 0300-1234567 (Velora Store) and keep your receipt handy.';
 if(pay==='card')d.innerHTML='<div class="grid grid-gap-2 space-y-2"><input class="inp" placeholder="Card Number (4111 2222...)"/><div class="grid grid-cols-2 gap-2"><input class="inp" placeholder="MM/YY"/><input class="inp" placeholder="CVV"/></div></div>';
}

function placeOrder(){
 const fn=$('#fn').value.trim(), ph=$('#ph').value.trim(), ct=$('#ct').value.trim(), ad=$('#ad').value.trim();
 if(!fn||!ph||!ct||!ad){toast('Please fill in all required delivery fields.');return;}
 
 const orderId='#VL-'+Math.floor(10000+Math.random()*90000);
 const newOrder={
  orderId,
  date:new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}),
  items:[...cart],
  shipping:{name:fn,phone:ph,city:ct,address:ad},
  totals:totals(),
  paymentMethod:pay,
  status:'Order Confirmed'
 };
 
 orders.unshift(newOrder);
 ls.set('velora_orders', orders);
 cart=[];
 promo=null;
 saveCart();
 go('success', orderId);
}

function vSuccess(orderId){
 const order=orders.find(o=>o.orderId===orderId)||orders[0];
 if(!order){go('home');return;}
 
 // Format WhatsApp message
 const itemsList = order.items.map(i => {
  const p = byId(i.id);
  return `• ${p ? p.n : 'Item'} x${i.q} (${fmt(p ? p.p * i.q : 0)})`;
 }).join('\n');

 const waMessage = encodeURIComponent(
  `🛍️ *NEW ORDER PLACED - VELORA*\n\n` +
  `*Order ID:* ${order.orderId}\n` +
  `*Date:* ${order.date}\n\n` +
  `*Customer Details:*\n` +
  `Name: ${order.shipping.name}\n` +
  `Phone: ${order.shipping.phone}\n` +
  `City: ${order.shipping.city}\n` +
  `Address: ${order.shipping.address}\n\n` +
  `*Items Ordered:*\n${itemsList}\n\n` +
  `*Payment Method:* ${order.paymentMethod.toUpperCase()}\n` +
  `*Total Amount:* ${fmt(order.totals.total)}`
 );

 const waLink = `https://wa.me/${BUSINESS_WHATSAPP}?text=${waMessage}`;

 $('#app').innerHTML=`
 <div class="max-w-xl mx-auto card p-6 md:p-8 text-center space-y-6">
  <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto">✓</div>
  <div>
   <h1 class="text-2xl font-extrabold">Order Confirmed Successfully!</h1>
   <p class="mut text-sm mt-1">Thank you for shopping with Velora. Your order has been placed.</p>
  </div>
  
  <div class="p-4 rounded-xl text-left space-y-2 border" style="border-color:var(--bd);background:var(--bg)">
   <div class="flex justify-between items-center"><span class="text-sm mut">Order Reference</span><b class="text-emerald-600 text-lg">${order.orderId}</b></div>
   <div class="flex justify-between text-sm"><span class="mut">Date</span><span>${order.date}</span></div>
   <div class="flex justify-between text-sm"><span class="mut">Payment</span><span class="uppercase">${order.paymentMethod}</span></div>
   <div class="flex justify-between text-sm"><span class="mut">Estimated Delivery</span><span>3–4 Business Days</span></div>
  </div>

  <div class="text-left space-y-2">
   <h3 class="font-bold text-sm">Delivery Address</h3>
   <p class="text-sm mut">${order.shipping.name} (${order.shipping.phone})<br>${order.shipping.address}, ${order.shipping.city}</p>
  </div>

  <div class="space-y-2">
   <a href="${waLink}" target="_blank" class="block w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-center hover:bg-emerald-700 transition">💬 Confirm Order via WhatsApp</a>
  </div>

  <div class="flex gap-3 pt-2">
   <button class="ghost btn flex-1" onclick="go('shop')">Continue Shopping</button>
   <button class="btn flex-1" onclick="go('orders')">View My Orders</button>
  </div>
 </div>`;
}

function vOrders(){
 $('#app').innerHTML=`
 <h1 class="text-2xl font-bold mb-4">Track Your Orders</h1>
 <div class="card p-4 max-w-xl mb-6 flex gap-2">
  <input id="trackingInput" class="inp" placeholder="Enter Order ID (e.g. #VL-49821)">
  <button id="trackBtn" class="btn" onclick="lookupOrder()">Track</button>
 </div>
 <div id="trackingResultContainer"></div>
 <h2 class="text-xl font-bold mt-8 mb-4">Recent Orders History</h2>
 <div id="ordersList" class="space-y-4"></div>`;
 renderOrdersList();
}

function lookupOrder(){
 const query=$('#trackingInput').value.trim().toUpperCase();
 const container=$('#trackingResultContainer');
 if(!query){toast('Please enter an Order ID');return;}
 
 const found=orders.find(o=>o.orderId.toUpperCase()===query);
 if(!found){
  container.innerHTML=`<div class="card p-4 text-center text-red-500 text-sm">No order found matching "${query}". Please check your Order ID.</div>`;
  return;
 }
 
 container.innerHTML=`
 <div class="card p-5 space-y-3 mb-6 border-2 border-emerald-500">
  <div class="flex justify-between items-center">
   <b class="text-lg">${found.orderId}</b>
   <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">${found.status}</span>
  </div>
  <p class="text-sm mut">Placed on ${found.date} · Delivery to <b>${found.shipping.name}</b> (${found.shipping.city})</p>
  <div class="space-y-1 text-sm border-t pt-3" style="border-color:var(--bd)">
   ${found.items.map(i=>{const p=byId(i.id);return `<div class="flex justify-between"><span>${p?p.n:'Product'} × ${i.q}</span><span>${fmt(p?p.p*i.q:0)}</span></div>`}).join('')}
  </div>
  <div class="flex justify-between font-bold pt-2 border-t" style="border-color:var(--bd)">
   <span>Total Amount:</span><span>${fmt(found.totals.total)}</span>
  </div>
 </div>`;
}

function renderOrdersList(){
 const list=$('#ordersList');
 if(!orders.length){
  list.innerHTML='<p class="mut">No past orders found on this device yet.</p>';
  return;
 }
 list.innerHTML=orders.map(o=>`
 <div class="card p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
  <div>
   <div class="flex items-center gap-2">
    <b>${o.orderId}</b>
    <span class="text-xs px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-medium">${o.status}</span>
   </div>
   <div class="text-sm mut mt-1">${o.date} · ${o.shipping.city} · <b>${fmt(o.totals.total)}</b></div>
  </div>
  <button class="ghost btn text-sm" onclick="go('success', '${o.orderId}')">View Details</button>
 </div>`).join('');
}

/* ===== ADMIN PORTAL ===== */
function renderAdminLogin(){
 $('#app').innerHTML=`<div class="max-w-md mx-auto card p-8 mt-12 space-y-4 text-center">
 <h1 class="text-2xl font-bold">Admin Portal</h1>
 <p class="mut text-sm">Enter secure access password to manage Velora Store.</p>
 <input id="apw" type="password" class="inp" placeholder="Password" onkeydown="if(event.key==='Enter')checkAdminPw()">
 <button class="btn w-full" onclick="checkAdminPw()">Login</button>
</div>`;
}
function checkAdminPw(){
 const inputPw = document.getElementById('apw').value.trim();
 if(inputPw === ADMIN_PASSWORD){
  sessionStorage.setItem('velora_admin_auth','true');
  go('admin');
 }else{
  toast('Incorrect password');
  const pwInput = document.getElementById('apw');
  if(pwInput){ pwInput.classList.add('bad'); setTimeout(()=>pwInput.classList.remove('bad'), 1000); }
 }
}
function renderAdmin(){
 if(sessionStorage.getItem('velora_admin_auth')!=='true'){go('admin_login');return;}
 $('#app').innerHTML=`
 <div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Store Admin Panel</h1>
  <button class="ghost btn text-sm" onclick="sessionStorage.removeItem('velora_admin_auth');go('home')">Logout</button>
 </div>
 <div class="grid md:grid-cols-3 gap-6 mb-8">
  <div class="card p-5"><div class="mut text-sm">Total Orders</div><div class="text-3xl font-extrabold mt-1">${orders.length}</div></div>
  <div class="card p-5"><div class="mut text-sm">Total Revenue</div><div class="text-3xl font-extrabold mt-1">${fmt(orders.reduce((s,o)=>s+o.totals.total,0))}</div></div>
  <div class="card p-5"><div class="mut text-sm">Products Listed</div><div class="text-3xl font-extrabold mt-1">${P.length}</div></div>
 </div>
 <h2 class="text-xl font-bold mb-4">Customer Orders Management</h2>
 <div class="space-y-3">${orders.length?orders.map(o=>`
 <div class="card p-4 flex flex-col md:flex-row justify-between gap-4">
  <div>
   <div class="flex items-center gap-2"><b>${o.orderId}</b><span class="text-xs mut">${o.date}</span></div>
   <div class="text-sm mt-1"><b>${o.shipping.name}</b> (${o.shipping.phone}) — ${o.shipping.address}, ${o.shipping.city}</div>
   <div class="text-xs mut mt-1">${o.items.map(i=>`${byId(i.id)?.n||'Item'} (${i.q})`).join(', ')}</div>
  </div>
  <div class="flex items-center gap-3">
   <b>${fmt(o.totals.total)}</b>
   <select class="inp !w-auto text-sm" onchange="updateStatus('${o.orderId}', this.value)">
    ${['Order Confirmed','Processing','Dispatched / In Transit','Delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
   </select>
  </div>
 </div>`).join(''):'<p class="mut">No orders placed yet.</p>'}</div>`;
}
function updateStatus(orderId, st){
 const o=orders.find(x=>x.orderId===orderId);
 if(o){o.status=st;ls.set('velora_orders',orders);toast('Status updated to '+st);}
}

// Init
fromHash();
saveCart();
</script>
</body>
</html>
