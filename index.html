<!DOCTYPE html>
<html lang="en" class="vc-pre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velora – Cinematic Modern Store</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root {
  --bg: #09090e;
  --fg: #f3f4f6;
  --card: #12131c;
  --bd: #222634;
  --mut: #9ca3af;
  --ac: #7c5cff;
  --ac2: #22d3ee;
  --glow: rgba(124, 92, 255, 0.25);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #f8f9fc;
  --fg: #111827;
  --card: #ffffff;
  --bd: #e2e8f0;
  --mut: #64748b;
  --ac: #6366f1;
  --ac2: #0ea5e9;
  --glow: rgba(99, 102, 241, 0.15);
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow-x: clip; transition: background 0.4s ease, color 0.4s ease; }

/* Custom Glass & Card Effects */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 1.25rem;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
  will-change: transform, box-shadow;
}
.card:hover {
  border-color: color-mix(in srgb, var(--ac) 50%, var(--bd));
  box-shadow: 0 20px 40px -15px var(--glow), 0 0 20px rgba(0,0,0,0.2);
  transform: translateY(-4px) scale(1.01);
}

/* Inputs & Buttons */
.inp {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 0.75rem;
  padding: 0.7rem 1rem;
  color: var(--fg);
  outline: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.inp:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px var(--glow);
}
.inp.bad { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); }

.btn {
  background: linear-gradient(135deg, var(--ac), #4f46e5);
  color: #fff;
  border-radius: 0.85rem;
  padding: 0.7rem 1.3rem;
  font-weight: 600;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 15px var(--glow);
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(rgba(255,255,255,0.2), transparent);
  opacity: 0; transition: opacity 0.2s;
}
.btn:hover::after { opacity: 1; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 8px 25px var(--glow); }
.btn:active { transform: translateY(0); }

.btn2 { background: linear-gradient(135deg, var(--ac2), #0284c7); }
.ghost { border: 1px solid var(--bd); background: var(--card); color: var(--fg); }
.ghost:hover { background: var(--bd); }

.chip {
  border: 1px solid var(--bd);
  border-radius: 0.75rem;
  padding: 0.45rem 1rem;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--card);
}
.chip:hover { border-color: var(--ac); transform: translateY(-2px); }
.chip.on { border-color: var(--ac); background: var(--ac); color: #fff; box-shadow: 0 4px 15px var(--glow); }

.mut { color: var(--mut); }

/* Cinematic Intro & Atmosphere Layers */
html.vc-pre body { visibility: hidden; animation: vc-failsafe 0s 4.5s forwards; }
@keyframes vc-failsafe { to { visibility: visible; } }
html.vc-lock { overflow: hidden; }

.vc-intro-layer {
  position: fixed; inset: 0; z-index: 2147483600; display: grid; place-items: center;
  background: #050509; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
}
.vc-intro-layer.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

.vc-ring {
  position: absolute; width: min(46vmin, 420px); aspect-ratio: 1; rotate: -90deg;
  filter: drop-shadow(0 0 20px rgba(124, 108, 255, 0.8));
}
.vc-ring circle { fill: none; stroke-width: 1.5; }
.vc-ring-bg { stroke: rgba(255, 255, 255, 0.08); }
.vc-ring-fg {
  stroke: #7c5cff; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: vc-draw 1.7s cubic-bezier(.65, 0, .2, 1) .15s forwards;
}
@keyframes vc-draw { to { stroke-dashoffset: 0; } }

.vc-word {
  position: relative; font-weight: 800; font-size: clamp(24px, 5.5vmin, 48px);
  letter-spacing: .55em; margin-right: -.55em;
  animation: vc-track 2.2s cubic-bezier(.16, 1, .3, 1) .3s forwards;
}
@keyframes vc-track { to { letter-spacing: .25em; margin-right: -.25em; } }
.vc-word span {
  display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(18px) scale(1.15);
  animation: vc-letter 1s cubic-bezier(.16, 1, .3, 1) forwards;
  animation-delay: calc(.55s + var(--i) * .09s);
}
@keyframes vc-letter { to { opacity: 1; filter: blur(0); transform: none; } }

.vc-count {
  position: absolute; left: 50%; bottom: 9vh; translate: -50% 0; opacity: .5;
  font: 500 12px/1 ui-monospace, monospace; letter-spacing: .3em;
}
.vc-skip {
  position: absolute; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 12px; cursor: pointer;
  transition: all 0.3s; backdrop-filter: blur(10px);
}
.vc-skip:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.4); }

/* Ambient Aurora & Grain */
.vc-aurora {
  position: fixed; inset: -30%; z-index: -1; pointer-events: none; opacity: 0.4;
  background:
    radial-gradient(40% 35% at 20% 30%, rgba(124, 92, 255, 0.4), transparent 70%),
    radial-gradient(35% 40% at 80% 25%, rgba(34, 211, 238, 0.35), transparent 70%),
    radial-gradient(45% 40% at 55% 85%, rgba(255, 79, 216, 0.3), transparent 70%);
  animation: vc-drift 26s ease-in-out infinite alternate;
}
@keyframes vc-drift { to { translate: 5% -4%; scale: 1.15; rotate: 8deg; } }

.vc-grain {
  position: fixed; inset: -50%; z-index: 2147483300; pointer-events: none; opacity: 0.04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: vc-grain 1s steps(6) infinite;
}
@keyframes vc-grain {
  0%, 100% { translate: 0 0; } 20% { translate: -3% 3%; } 40% { translate: 2% -4%; }
  60% { translate: -5% -1%; } 80% { translate: 4% 3%; }
}

.vc-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 2147483200;
  pointer-events: none; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, var(--ac), var(--ac2), #ff4fd8);
  box-shadow: 0 0 12px var(--ac);
}

/* Custom Cursor */
.vc-cursor, .vc-dot {
  position: fixed; left: 0; top: 0; z-index: 2147483400; pointer-events: none;
  mix-blend-mode: difference; opacity: 0; transition: opacity 0.3s;
}
.vc-cursor { width: 42px; height: 42px; margin: -21px 0 0 -21px; border: 1.5px solid #fff; border-radius: 50%; transition: transform 0.15s ease-out; }
.vc-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #fff; border-radius: 50%; }

/* Route Transition Curtain */
.vc-curtain {
  position: fixed; inset: 0; z-index: 2147483500; pointer-events: none; visibility: hidden;
  transform: translate3d(0, 100%, 0); transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
  background: radial-gradient(60% 50% at 50% 100%, rgba(124, 92, 255, 0.4), #07070b 70%);
}
.vc-curtain.active { transform: translate3d(0, 0, 0); pointer-events: auto; }

/* Drawer & Modal Styling */
#drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: -10px 0 50px rgba(0,0,0,0.5); }
#ov { backdrop-filter: blur(8px); transition: opacity 0.3s ease; }

/* Floating Animations */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.animate-float { animation: float 5s ease-in-out infinite; }
</style>
</head>
<body>

<!-- CINEMATIC INTRO LAYER -->
<div id="introLayer" class="vc-intro-layer">
  <svg class="vc-ring" viewBox="0 0 100 100">

  <button onclick="toggleTheme()" class="ghost btn px-3 py-2 text-sm rounded-xl flex items-center justify-center" aria-label="Theme">◐</button>

 </div>
 <nav class="md:hidden flex gap-6 px-4 pb-3 text-sm font-medium border-t border-[var(--bd)] overflow-x-auto pt-2">
   <a href="#home" onclick="go('home')">Home</a>
   <a href="#shop" onclick="go('shop')">Shop</a>

 </nav>
</header>

<!-- MAIN APP CONTAINER -->
<main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 py-8 min-h-[75vh]"></main>

<!-- FOOTER -->
<footer class="text-center text-sm mut py-12 border-t mt-16" style="border-color:var(--bd); background: var(--card);">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
   <p>© 2026 Velora Store · Ultra Sonic Edition · Free delivery over Rs. 5,000</p>
   <div class="flex gap-6 text-xs font-medium">
     <a href="#" onclick="go('shop'); return false;" class="hover:text-[var(--ac)]">Catalog</a>
     <a href="#" onclick="go('orders'); return false;" class="hover:text-[var(--ac)]">Track Orders</a>
     <a href="#" onclick="adminLoginPrompt(); return false;" class="hover:text-[var(--ac)]">Admin Portal</a>
   </div>
 </div>
</footer>

<!-- CART DRAWER -->
<div id="ov" onclick="drawer(false)" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0"></div>
<aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md z-50 translate-x-full flex flex-col" style="background:var(--card)">
 <div class="p-5 border-b flex justify-between items-center" style="border-color:var(--bd)">
   <div class="flex items-center gap-3">
     <b class="text-xl tracking-tight">Your Cart</b>
     <span id="cartCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-[var(--ac)] text-white font-bold">0 items</span>
   </div>
   <button onclick="drawer(false)" class="text-2xl w-8 h-8 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors">×</button>
 </div>
 <div id="dbody" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
 <div id="dfoot" class="p-5 border-t" style="border-color:var(--bd)"></div>
</aside>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900/90 border border-white/10 text-white px-6 py-3 rounded-2xl text-sm font-medium shadow-2xl backdrop-blur-xl transition-all duration-300 translate-y-12 opacity-0 pointer-events-none flex items-center gap-3">
 <span id="toastIcon" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
 <span id="toastText">Action successful</span>
</div>

<script>
/* ===== DATA & STATE ===== */
const CATS = ['All', 'Graphic Tees', 'Plain Tees', 'Striped Tees', 'Electronics', 'Fashion', 'Home & Living', 'Beauty', 'Fitness', 'Accessories'];
const GRAD = {
  'Graphic Tees': ['#7c5cff','#22d3ee'], 'Plain Tees': ['#f59e0b','#f472b6'], 
  'Striped Tees': ['#64748b','#0ea5e9'], 'Electronics': ['#6366f1','#22d3ee'], 
  'Fashion': ['#f472b6','#fb923c'], 'Home & Living': ['#34d399','#a3e635'], 
  'Beauty': ['#f9a8d4','#c084fc'], 'Fitness': ['#f59e0b','#ef4444'], 'Accessories': ['#64748b','#0ea5e9']
};

const BUSINESS_WHATSAPP = '923102179996';
const ADMIN_PASSWORD = 'abc123abc';

let products = [
  { id: 1, name: 'Cyberpunk Neon Oversized Tee', cat: 'Graphic Tees', price: 4200, rating: 4.9, stock: 15, tag: 'Bestseller', emoji: '⚡', desc: 'High-density breathable cotton with futuristic cyberpunk graphics and ultra-soft finish.' },
  { id: 2, name: 'Minimalist Heavyweight Plain Tee', cat: 'Plain Tees', price: 2900, rating: 4.8, stock: 25, tag: 'Essential', emoji: '👕', desc: '240 GSM combed cotton tailored for a premium boxy streetwear drape.' },
  { id: 3, name: 'Retro Horizon Striped Polo', cat: 'Striped Tees', price: 3800, rating: 4.7, stock: 12, tag: 'New', emoji: '🧶', desc: 'Vintage yarn-dyed striped knit polo engineered for effortless summer style.' },
  { id: 4, name: 'Sonic Pro Active Earbuds X9', cat: 'Electronics', price: 8500, rating: 5.0, stock: 8, tag: 'Hot', emoji: '🎧', desc: 'Active noise cancellation with spatial audio and 40-hour ultra battery life.' },
  { id: 5, name: 'Aether Leather Crossbody Sling', cat: 'Fashion', price: 6200, rating: 4.9, stock: 10, tag: 'Limited', emoji: '💼', desc: 'Water-resistant vegan leather sling bag with magnetic Fidlock buckle.' },
  { id: 6, name: 'Glow Ambient Desk Lightbar', cat: 'Home & Living', price: 5400, rating: 4.8, stock: 14, tag: 'Popular', emoji: '💡', desc: 'RGBic smart monitor lightbar with touch controls and music sync mode.' },
  { id: 7, name: 'Botanical Radiance Serum 50ml', cat: 'Beauty', price: 3500, rating: 4.9, stock: 20, tag: 'Organic', emoji: '🌿', desc: 'Niacinamide and hyaluronic acid hydrating booster for glass skin.' },
  { id: 8, name: 'Titanium Grip Dumbbell Set', cat: 'Fitness', price: 12500, rating: 5.0, stock: 5, tag: 'Pro', emoji: '🏋️', desc: 'Adjustable ergonomic dumbbells with anti-roll hexagonal rubber coating.' }
];

let cart = JSON.parse(localStorage.getItem('velora_cart') || '[]');
let orders = JSON.parse(localStorage.getItem('velora_orders') || '[]');
let currentRoute = 'home';
let selectedCat = 'All';
let searchQuery = '';

/* ===== CINEMATIC INTRO CONTROLLER ===== */
let introTimer = null;
function initIntro() {
  const countEl = document.getElementById('introCount');
  let p = 0;
  introTimer = setInterval(() => {
    p += Math.floor(Math.random() * 8) + 5;
    if (p >= 100) {
      p = 100;
      clearInterval(introTimer);
      setTimeout(dismissIntro, 400);
    }
    countEl.textContent = p + '%';
  }, 90);
}

function dismissIntro() {
  clearInterval(introTimer);
  const layer = document.getElementById('introLayer');
  layer.classList.add('fade-out');
  document.documentElement.classList.remove('vc-lock');
  document.documentElement.classList.remove('vc-pre');
  showToast('Welcome to Velora Experience ⚡', 'emerald');
}

document.documentElement.classList.add('vc-lock');
window.addEventListener('DOMContentLoaded', initIntro);

/* ===== CUSTOM CURSOR & SCROLL PROGRESS ===== */
const cursor = document.getElementById('vcCursor');
const dot = document.getElementById('vcDot');
let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
  dot.style.opacity = '1';
  cursor.style.opacity = '1';
});

function renderCursor() {
  cursorX += (mouseX - cursorX) * 0.2;
  cursorY += (mouseY - cursorY) * 0.2;
  cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
  requestAnimationFrame(renderCursor);
}
renderCursor();

window.addEventListener('scroll', () => {
  const st = window.scrollY;
  const dh = document.documentElement.scrollHeight - window.innerHeight;
  const pct = dh > 0 ? st / dh : 0;
  document.getElementById('progressBar').style.transform = `scaleX(${pct})`;
});

/* ===== TOAST SYSTEM ===== */
function showToast(msg, type = 'emerald') {
  const toast = document.getElementById('toast');
  const txt = document.getElementById('toastText');
  const icon = document.getElementById('toastIcon');
  txt.textContent = msg;
  icon.className = `w-2 h-2 rounded-full animate-pulse ${type === 'red' ? 'bg-red-400' : 'bg-emerald-400'}`;
  toast.classList.remove('translate-y-12', 'opacity-0');
  setTimeout(() => {
    toast.classList.add('translate-y-12', 'opacity-0');
  }, 3000);
}

/* ===== ROUTING & VIEW CONTROLLER ===== */
function go(route) {
  const curtain = document.getElementById('vcCurtain');
  curtain.classList.add('active');
  setTimeout(() => {
    currentRoute = route;
    window.scrollTo({ top: 0, behavior: 'instant' });
    renderApp();
    curtain.classList.remove('active');
  }, 350);
}

function renderApp() {
  const app = document.getElementById('app');
  updateCartUI();
  
  if (currentRoute === 'home') app.innerHTML = renderHome();
  else if (currentRoute === 'shop') app.innerHTML = renderShop();
  else if (currentRoute === 'orders') app.innerHTML = renderOrders();
  else if (currentRoute === 'admin') app.innerHTML = renderAdmin();
  else app.innerHTML = renderHome();
}

/* ===== HOME VIEW ===== */
function renderHome() {
  return `
    <div class="space-y-16">
      <!-- HERO BANNER -->
      <div class="relative rounded-3xl overflow-hidden p-8 sm:p-16 border border-[var(--bd)] shadow-2xl flex flex-col justify-center min-h-[500px]" style="background: radial-gradient(circle at 70% 30%, rgba(124,92,255,0.25) 0%, rgba(34,211,238,0.1) 40%, var(--card) 80%);">
        <div class="absolute -right-20 -top-20 w-96 h-96 rounded-full blur-3xl opacity-30 pointer-events-none" style="background: var(--ac);"></div>
        <div class="max-w-2xl relative z-10 space-y-6">
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase border border-[var(--ac)] bg-[var(--ac)]/10 text-[var(--ac)]">
            <span>⚡ Next-Gen E-Commerce 2026</span>
          </div>
          <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight">
            Elevate Your Style & Living With <span style="color:var(--ac)" class="drop-shadow-lg">Velora</span>
          </h1>
          <p class="text-base sm:text-lg mut">
            Discover ultra-responsive tech, futuristic apparel, and curated essentials designed with unmatched precision and acoustic aesthetics.
          </p>
          <div class="flex flex-wrap gap-4 pt-2">
            <button onclick="go('shop')" class="btn text-base px-8 py-4 font-bold flex items-center gap-3 shadow-xl">
              <span>Explore Collection</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </button>
            <button onclick="drawer(true)" class="ghost btn px-6 py-4 font-bold text-base rounded-xl backdrop-blur-md">
              View Cart (${cart.reduce((a,b)=>a+b.qty,0)})
            </button>
          </div>
        </div>
        <div class="mt-8 flex items-center gap-8 pt-6 border-t border-[var(--bd)]/50 text-sm mut">
          <div><b class="text-[var(--fg)] text-lg block">15,000+</b> Happy Customers</div>
          <div><b class="text-[var(--fg)] text-lg block">4.9 / 5.0</b> Average Rating</div>
          <div><b class="text-[var(--fg)] text-lg block">24/7</b> Express Support</div>
        </div>
      </div>

      <!-- FEATURED CATEGORIES -->
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold tracking-tight">Trending Categories</h2>
          <button onclick="go('shop')" class="text-sm font-semibold text-[var(--ac)] hover:underline">View All →</button>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          ${['Graphic Tees', 'Electronics', 'Fashion', 'Home & Living'].map(cat => `
            <div onclick="selectedCat='${cat}'; go('shop');" class="card p-6 cursor-pointer flex flex-col items-center text-center gap-3 group">
              <span class="text-4xl p-4 rounded-2xl bg-[var(--bg)] group-hover:scale-110 transition-transform">${getCategoryEmoji(cat)}</span>
              <h3 class="font-bold text-sm">${cat}</h3>
              <span class="text-xs mut">Explore items</span>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- FEATURED PRODUCTS -->
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold tracking-tight">Featured Products</h2>
          <button onclick="go('shop')" class="text-sm font-semibold text-[var(--ac)] hover:underline">Browse Shop →</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          ${products.slice(0, 4).map(p => renderProductCard(p)).join('')}
        </div>
      </div>
    </div>
  `;
}

function getCategoryEmoji(cat) {
  const map = { 'Graphic Tees': '👕', 'Electronics': '🎧', 'Fashion': '💼', 'Home & Living': '💡', 'Plain Tees': '👔', 'Striped Tees': '🧶', 'Beauty': '🌿', 'Fitness': '🏋️', 'Accessories': '👓' };
  return map[cat] || '✨';
}

/* ===== SHOP VIEW ===== */
function renderShop() {
  const filtered = products.filter(p => {
    const matchCat = selectedCat === 'All' || p.cat === selectedCat;
    const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.cat.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });

  return `
    <div class="space-y-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">Velora Catalog</h1>
          <p class="text-sm mut mt-1">Browse our complete lineup of premium gear and apparel.</p>
        </div>
        <div class="relative w-full md:w-80">
          <input oninput="searchQuery=this.value; renderApp();" value="${searchQuery}" placeholder="Search catalog..." class="inp text-sm pl-9">
          <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
      </div>

      <!-- CATEGORY CHIPS -->
      <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        ${CATS.map(c => `
          <button onclick="selectedCat='${c}'; renderApp();" class="chip ${selectedCat === c ? 'on' : ''}">${c}</button>
        `).join('')}
      </div>

      <!-- PRODUCT GRID -->
      ${filtered.length === 0 ? `
        <div class="text-center py-20 card p-12 space-y-4">
          <span class="text-5xl">🔍</span>
          <h3 class="text-xl font-bold">No products found</h3>
          <p class="text-sm mut">Try adjusting your search or category filter.</p>
          <button onclick="selectedCat='All'; searchQuery=''; renderApp();" class="btn text-sm px-6 py-2 mt-2">Reset Filters</button>
        </div>
      ` : `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          ${filtered.map(p => renderProductCard(p)).join('')}
        </div>
      `}
    </div>
  `;
}

function renderProductCard(p) {
  const [c1, c2] = GRAD[p.cat] || ['#7c5cff', '#22d3ee'];
  return `
    <div class="card overflow-hidden flex flex-col group">
      <div class="aspect-square relative flex items-center justify-center p-6 overflow-hidden" style="background: linear-gradient(135deg, ${c1}15, ${c2}15);">
        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-bold tracking-wide uppercase bg-black/40 text-white backdrop-blur-md">
          ${p.tag}
        </div>
        <div class="absolute top-3 right-3 text-xs font-semibold px-2 py-0.5 rounded-md bg-[var(--card)] border border-[var(--bd)] flex items-center gap-1">
          <span>⭐</span> ${p.rating}
        </div>
        <span class="text-7xl group-hover:scale-125 transition-transform duration-500 drop-shadow-2xl">${p.emoji}</span>
      </div>
      <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
        <div class="space-y-1.5">
          <div class="text-xs font-semibold text-[var(--ac)] tracking-wider uppercase">${p.cat}</div>
          <h3 class="font-bold text-base leading-snug line-clamp-1">${p.name}</h3>
          <p class="text-xs mut line-clamp-2">${p.desc}</p>
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-[var(--bd)]">
          <div>
            <span class="text-xs mut block">Price</span>
            <b class="text-lg font-extrabold">Rs. ${p.price.toLocaleString()}</b>
          </div>
          <button onclick="addToCart(${p.id})" class="btn text-xs px-4 py-2.5 flex items-center gap-1.5 font-bold">
            <span>+ Add</span>
          </button>
        </div>
      </div>
    </div>
  `;
}

/* ===== CART & CHECKOUT LOGIC ===== */
function addToCart(id) {
  const prod = products.find(p => p.id === id);
  if (!prod) return;
  const existing = cart.find(item => item.id === id);
  if (existing) {
    if (existing.qty < prod.stock) existing.qty++;
    else { showToast('Maximum stock limit reached', 'red'); return; }
  } else {
    cart.push({ ...prod, qty: 1 });
  }
  syncCart();
  showToast(`Added "${prod.name}" to cart`);
  drawer(true);
}

function updateQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  syncCart();
}

function syncCart() {
  localStorage.setItem('velora_cart', JSON.stringify(cart));
  updateCartUI();
}

function updateCartUI() {
  const totalQty = cart.reduce((a, b) => a + b.qty, 0);
  document.getElementById('cc').textContent = totalQty;
  document.getElementById('cartCountBadge').textContent = `${totalQty} items`;
  
  const dbody = document.getElementById('dbody');
  const dfoot = document.getElementById('dfoot');
  
  if (cart.length === 0) {
    dbody.innerHTML = `
      <div class="text-center py-20 space-y-4">
        <span class="text-5xl">🛒</span>
        <h4 class="font-bold text-lg">Your cart is empty</h4>
        <p class="text-sm mut">Explore our shop and add items to your cart.</p>
        <button onclick="drawer(false); go('shop');" class="btn text-xs px-6 py-2.5">Start Shopping</button>
      </div>
    `;
    dfoot.innerHTML = '';
    return;
  }

  dbody.innerHTML = cart.map(item => `
    <div class="card p-4 flex items-center gap-4">
      <div class="w-16 h-16 rounded-xl flex items-center justify-center text-3xl bg-[var(--bg)] border border-[var(--bd)] shrink-0">
        ${item.emoji}
      </div>
      <div class="flex-1 min-w-0">
        <h5 class="font-bold text-sm truncate">${item.name}</h5>
        <p class="text-xs mut">Rs. ${item.price.toLocaleString()} each</p>
        <div class="flex items-center gap-3 mt-2">
          <button onclick="updateQty(${item.id}, -1)" class="w-7 h-7 rounded-lg bg-[var(--bg)] border border-[var(--bd)] font-bold text-xs hover:border-[var(--ac)]">-</button>
          <span class="text-sm font-bold">${item.qty}</span>
          <button onclick="updateQty(${item.id}, 1)" class="w-7 h-7 rounded-lg bg-[var(--bg)] border border-[var(--bd)] font-bold text-xs hover:border-[var(--ac)]">+</button>
        </div>
      </div>
      <div class="text-right">
        <b class="text-sm block">Rs. ${(item.price * item.qty).toLocaleString()}</b>
        <button onclick="updateQty(${item.id}, -999)" class="text-xs text-red-400 hover:underline mt-1">Remove</button>
      </div>
    </div>
  `).join('');

  const subtotal = cart.reduce((a, b) => a + (b.price * b.qty), 0);
  const delivery = subtotal > 5000 ? 0 : 250;
  const total = subtotal + delivery;

  dfoot.innerHTML = `
    <div class="space-y-3 mb-4">
      <div class="flex justify-between text-sm">
        <span class="mut">Subtotal</span>
        <b class="font-semibold">Rs. ${subtotal.toLocaleString()}</b>
      </div>
      <div class="flex justify-between text-sm">
        <span class="mut">Delivery ${subtotal > 5000 ? '(Free over Rs. 5k)' : ''}</span>
        <b class="font-semibold">${delivery === 0 ? 'FREE' : 'Rs. ' + delivery.toLocaleString()}</b>
      </div>
      <div class="flex justify-between text-base pt-3 border-t border-[var(--bd)]">
        <b>Total Amount</b>
        <b class="text-lg text-[var(--ac)]">Rs. ${total.toLocaleString()}</b>
      </div>
    </div>
    <div class="space-y-3">
      <input id="checkoutName" placeholder="Full Name" class="inp text-sm">
      <input id="checkoutPhone" placeholder="Phone Number (WhatsApp)" class="inp text-sm">
      <textarea id="checkoutAddress" placeholder="Delivery Address (Karachi / Pakistan)" class="inp text-sm resize-none h-20"></textarea>
      <button onclick="checkoutWhatsApp(${total})" class="btn w-full py-3.5 text-sm font-bold flex items-center justify-center gap-2">
        <span>Place Order via WhatsApp 💬</span>
      </button>
    </div>
  `;
}

function drawer(open) {
  const drw = document.getElementById('drawer');
  const ov = document.getElementById('ov');
  if (open) {
    ov.classList.remove('hidden');
    setTimeout(() => ov.classList.remove('opacity-0'), 10);
    drw.classList.remove('translate-x-full');
  } else {
    ov.classList.add('opacity-0');
    setTimeout(() => ov.classList.add('hidden'), 300);
    drw.classList.add('translate-x-full');
  }
}

function checkoutWhatsApp(total) {
  const name = document.getElementById('checkoutName').value.trim();
  const phone = document.getElementById('checkoutPhone').value.trim();
  const address = document.getElementById('checkoutAddress').value.trim();

  if (!name || !phone || !address) {
    showToast('Please fill in all checkout details', 'red');
    return;
  }

  const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
  const orderItems = cart.map(i => `• ${i.name} (x${i.qty}) - Rs. ${i.price * i.qty}`).join('\n');
  
  const msg = `⚡ *NEW VELORA ORDER* ⚡\n\n*Order ID:* ${orderId}\n*Name:* ${name}\n*Phone:* ${phone}\n*Address:* ${address}\n\n*Items:*\n${orderItems}\n\n*Total:* Rs. ${total.toLocaleString()}\n\nPlease confirm my order!`;

  const newOrder = {
    id: orderId,
    date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    name, phone, address, items: [...cart], total, status: 'Pending Confirmation'
  };

  orders.unshift(newOrder);
  localStorage.setItem('velora_orders', JSON.stringify(orders));
  
  cart = [];
  syncCart();
  drawer(false);

  const url = `https://wa.me/${BUSINESS_WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  showToast('Order placed successfully! Opening WhatsApp...', 'emerald');
  go('orders');
}

/* ===== ORDERS VIEW ===== */
function renderOrders() {
  return `
    <div class="space-y-8 max-w-3xl mx-auto">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">Your Order History</h1>
        <p class="text-sm mut mt-1">Track and review your recent Velora purchases.</p>
      </div>

      ${orders.length === 0 ? `
        <div class="card p-12 text-center space-y-4">
          <span class="text-5xl">📦</span>
          <h3 class="text-xl font-bold">No orders placed yet</h3>
          <p class="text-sm mut">Your active and past orders will appear here.</p>
          <button onclick="go('shop')" class="btn text-xs px-6 py-2.5">Browse Catalog</button>
        </div>
      ` : `
        <div class="space-y-6">
          ${orders.map(o => `
            <div class="card p-6 space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-[var(--bd)]">
                <div>
                  <div class="flex items-center gap-3">
                    <b class="text-base">${o.id}</b>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${o.status}</span>
                  </div>
                  <span class="text-xs mut mt-1 block">Placed on ${o.date}</span>
                </div>
                <div class="text-right">
                  <span class="text-xs mut block">Total Amount</span>
                  <b class="text-lg font-extrabold text-[var(--ac)]">Rs. ${o.total.toLocaleString()}</b>
                </div>
              </div>
              <div class="space-y-2">
                <span class="text-xs font-semibold text-[var(--mut)] uppercase tracking-wider">Ordered Items</span>
                <div class="space-y-1">
                  ${o.items.map(i => `
                    <div class="flex justify-between text-sm py-1 border-b border-[var(--bd)]/50">
                      <span>${i.emoji} ${i.name} <span class="text-xs mut">x${i.qty}</span></span>
                      <b class="font-medium">Rs. ${(i.price * i.qty).toLocaleString()}</b>
                    </div>
                  `).join('')}
                </div>
              </div>
              <div class="pt-2 text-xs mut flex flex-col sm:flex-row justify-between gap-1">
                <span>📍 <b>Ship to:</b> ${o.name}, ${o.address}</span>
                <span>📞 ${o.phone}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

/* ===== ADMIN PORTAL ===== */
function adminLoginPrompt() {
  const pwd = prompt('Enter Admin Password (default: abc123abc):');
  if (pwd === ADMIN_PASSWORD) {
    document.documentElement.classList.add('vc-admin');
    go('admin');
    showToast('Admin access granted', 'emerald');
  } else if (pwd !== null) {
    showToast('Incorrect password', 'red');
  }
}

function renderAdmin() {
  return `
    <div class="space-y-8 max-w-5xl mx-auto">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">Velora Admin Dashboard</h1>
          <p class="text-sm mut mt-1">Manage store inventory, products, and customer orders.</p>
        </div>
        <button onclick="go('home')" class="ghost btn text-xs px-4 py-2">Exit Admin</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="card p-6 space-y-2">
          <span class="text-xs mut font-semibold uppercase">Total Products</span>
          <b class="text-3xl font-extrabold block">${products.length}</b>
        </div>
        <div class="card p-6 space-y-2">
          <span class="text-xs mut font-semibold uppercase">Total Orders</span>
          <b class="text-3xl font-extrabold block text-[var(--ac)]">${orders.length}</b>
        </div>
        <div class="card p-6 space-y-2">
          <span class="text-xs mut font-semibold uppercase">Store Revenue</span>
          <b class="text-3xl font-extrabold block text-emerald-400">Rs. ${orders.reduce((a,b)=>a+b.total,0).toLocaleString()}</b>
        </div>
      </div>

      <div class="card p-6 space-y-6">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-bold">Manage Products</h3>
          <button onclick="addNewProductPrompt()" class="btn text-xs px-4 py-2 font-bold">+ Add Product</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b border-[var(--bd)] text-xs mut uppercase">
                <th class="pb-3">Product</th>
                <th class="pb-3">Category</th>
                <th class="pb-3">Price</th>
                <th class="pb-3">Stock</th>
                <th class="pb-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[var(--bd)]">
              ${products.map(p => `
                <tr class="hover:bg-white/5 transition-colors">
                  <td class="py-3 font-medium flex items-center gap-3">
                    <span class="text-2xl">${p.emoji}</span>
                    <span>${p.name}</span>
                  </td>
                  <td class="py-3 text-xs mut">${p.cat}</td>
                  <td class="py-3 font-semibold">Rs. ${p.price.toLocaleString()}</td>
                  <td class="py-3"><span class="px-2 py-0.5 rounded-full text-xs bg-white/10 font-bold">${p.stock} units</span></td>
                  <td class="py-3 text-right space-x-2">
                    <button onclick="editStock(${p.id})" class="text-xs text-[var(--ac2)] hover:underline">Stock</button>
                    <button onclick="deleteProduct(${p.id})" class="text-xs text-red-400 hover:underline">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function addNewProductPrompt() {
  const name = prompt('Product Name:');
  if (!name) return;
  const cat = prompt('Category (Graphic Tees, Electronics, Fashion, etc.):', 'Graphic Tees');
  const price = parseInt(prompt('Price in PKR:', '3500')) || 3000;
  const stock = parseInt(prompt('Stock quantity:', '15')) || 10;
  const emoji = prompt('Emoji icon:', '✨');
  
  products.push({ id: Date.now(), name, cat: cat || 'Accessories', price, rating: 5.0, stock, tag: 'New', emoji: emoji || '✨', desc: 'Newly added custom item.' });
  showToast('Product added successfully', 'emerald');
  renderApp();
}

function editStock(id) {
  const p = products.find(prod => prod.id === id);
  if (!p) return;
  const ns = prompt(`Update stock for ${p.name}:`, p.stock);
  if (ns !== null) {
    p.stock = parseInt(ns) || 0;
    showToast('Stock updated', 'emerald');
    renderApp();
  }
}

function deleteProduct(id) {
  if (confirm('Delete this product?')) {
    products = products.filter(p => p.id !== id);
    showToast('Product deleted', 'red');
    renderApp();
  }
}

/* ===== THEME SWITCHER ===== */
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'light';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    showToast('Switched to Dark Cinematic Mode');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    showToast('Switched to Light Mode');
  }
}

/* ===== INITIAL RENDER ON LOAD ===== */
window.addEventListener('DOMContentLoaded', () => {
  renderApp();
});
</script>
</body>
</html>
