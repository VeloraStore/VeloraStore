<head>
<meta charset="utf-8">

<title>Velora – Modern Store</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f7f7f8;--fg:#1f2326;--card:#fff;--bd:#e5e7eb;--mut:#6b7280;--ac:#059669;--ac2:#4f46e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111315;--fg:#eceef0;--card:#1b1e21;--bd:#2c3034;--mut:#9ca3af}}
:root[data-theme="dark"]{--bg:#111315;--fg:#eceef0;--card:#1b1e21;--bd:#2c3034;--mut:#9ca3af}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;transition:.2s}
.card:hover.hv{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:.6rem;padding:.55rem .75rem;color:var(--fg)}
.inp.bad{border-color:#dc2626;background:#dc26260d}
.btn{background:var(--ac);color:#fff;border-radius:.7rem;padding:.6rem 1.1rem;font-weight:600;transition:.2s}.btn:hover{filter:brightness(1.1)}
.btn2{background:var(--ac2)}.ghost{border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.danger{background:#dc2626;color:#fff;border-radius:.6rem;padding:.35rem .8rem;font-weight:600;font-size:.8rem}.danger:hover{filter:brightness(1.1)}
.chip{border:1px solid var(--bd);border-radius:.6rem;padding:.3rem .7rem;cursor:pointer}.chip.on{border-color:var(--ac2);background:var(--ac2);color:#fff}
.mut{color:var(--mut)}
.atab{padding:.55rem 1rem;border-bottom:2px solid transparent;font-weight:600;color:var(--mut)}.atab.on{color:var(--ac);border-color:var(--ac)}
.ptbl{width:100%;font-size:.875rem;border-collapse:collapse;min-width:640px}.ptbl th{text-align:left;font-weight:600;color:var(--mut);padding:.5rem;border-bottom:1px solid var(--bd)}.ptbl td{padding:.5rem;border-bottom:1px solid var(--bd);vertical-align:middle}
.ptbl .inp{padding:.3rem .5rem}
body{overflow-x:clip}
.cine{position:relative;width:100vw;margin-left:calc(50% - 50vw);margin-top:-1.5rem}
.cine-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1a1030 0%,#07060d 65%);color:#eef0ff;perspective:900px;perspective-origin:50% 50%;--g:0px}
.cine-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cvig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75))}
.glt{text-shadow:var(--g) 0 0 rgba(255,0,200,.85),calc(var(--g)*-1) 0 0 rgba(0,230,255,.85)}
.cintro{position:absolute;left:0;right:0;top:44%;text-align:center;transform:translateY(-50%);pointer-events:none;font-family:ui-monospace,'SF Mono',Menlo,monospace}
.cintro h1{font-size:clamp(3rem,17vw,10rem);font-weight:800;letter-spacing:.06em;line-height:1}
.cintro p{margin-top:1rem;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:#a99cff;animation:cbob 1.6s ease-in-out infinite}
@keyframes cbob{50%{transform:translateY(6px)}}
.fc{position:absolute;left:50%;top:50%;width:min(78vw,400px);display:none;border-radius:22px;overflow:hidden;pointer-events:none;will-change:transform,opacity;backface-visibility:hidden;border:1px solid rgba(var(--c),.6);background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 60%),rgba(10,8,20,.55);box-shadow:0 0 70px rgba(var(--c),.35),inset 0 0 30px rgba(255,255,255,.04)}
.fc-img{aspect-ratio:4/5;position:relative;display:flex;align-items:center;justify-content:center;background:#120d24;overflow:hidden}
.fc-img::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.fc-img img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.cemo{font-size:5.5rem}
.fc-meta{padding:1rem 1.2rem 1.25rem}
.fc-meta small{font-family:ui-monospace,Menlo,monospace;letter-spacing:.25em;font-size:.62rem;color:rgb(var(--c));filter:brightness(1.6)}
.fc-meta h3{font-family:ui-monospace,'SF Mono',Menlo,monospace;text-transform:uppercase;font-size:clamp(1.05rem,3.2vw,1.6rem);letter-spacing:.04em;margin:.35rem 0;line-height:1.15}
.fc-meta .cp{font-weight:700;color:#fff}
.cbtns{display:flex;gap:.6rem;margin-top:.8rem}
.cbtns button{border:1px solid rgba(var(--c),.9);color:#fff;padding:.55rem 1.1rem;border-radius:999px;background:rgba(var(--c),.15);font-weight:600;font-size:.8rem;transition:.2s}
.cbtns button:first-child{background:rgb(var(--c));color:#0a0814}
.cbtns button:hover{filter:brightness(1.2)}
.fc.fin{width:min(86vw,640px);text-align:center;padding:2.4rem 1.4rem}
.fc.fin h2{font-family:Georgia,serif;font-size:clamp(2.2rem,9vw,4.2rem);line-height:1.05}
.fc.fin em{color:#b9a7ff}
.fc.fin p{margin-top:.9rem;font-size:.8rem;color:#c8c2e8}
.fc.fin button{margin-top:1.2rem;border:1px solid #b9a7ff;color:#fff;padding:.8rem 1.8rem;border-radius:999px;background:rgba(160,120,255,.2);font-weight:600;letter-spacing:.08em}
.chud{position:absolute;left:5%;bottom:5%;font-family:ui-monospace,Menlo,monospace;font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:#a99cff}
.cbar{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#7c5cff,#ff4fd8,#4fc3ff)}
#drawer{transition:transform .3s}


/* Embedded from velora-cinema.css */
/*! Velora Cinema v1.0 — cinematic layer. Load AFTER velora-motion.css. Purely additive. */

:root { --vc-a: #7c6cff; --vc-b: #22d3ee; --vc-c: #ff4fd8; }

/* Hide the page until the intro overlay exists (needs the 1-line <head> snippet).
   Failsafe: shows the page after 4.5s even if the JS never loads. */
html.vc-pre body { visibility: hidden; animation: vc-failsafe 0s 4.5s forwards; }
@keyframes vc-failsafe { to { visibility: visible; } }
html.vc-lock { overflow: hidden; }

/* Your OLD opening animation (auto-detected full-screen loader) is switched off */
.vc-legacy { display: none !important; }

/* While the intro plays, hold the hero entrance so it fires as the curtain opens */
html.vc-intro :is(.vm-rise, .vm-w > span, .vm-float) { animation-play-state: paused; }
html.vc-intro .vm-reveal.vm-in { opacity: 0; translate: 0 32px; }

/* ───────────── 1 · INTRO ───────────── */
.vc-intro-layer {
  position: fixed; inset: 0; z-index: 2147483600; display: grid; place-items: center;
  background: #050509; color: #fff; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.vc-ic { position: absolute; inset: 0; width: 100%; height: 100%; }
.vc-ring { position: absolute; width: min(46vmin, 420px); aspect-ratio: 1; rotate: -90deg;
           filter: drop-shadow(0 0 14px rgb(124 108 255 / .85)); }
.vc-ring circle { fill: none; stroke-width: 1.2; }
.vc-ring-bg { stroke: rgb(255 255 255 / .08); }
.vc-ring-fg { stroke: #fff; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1;
              animation: vc-draw 1.7s cubic-bezier(.65, 0, .2, 1) .15s forwards; }
@keyframes vc-draw { to { stroke-dashoffset: 0; } }

.vc-word { position: relative; font-weight: 700; font-size: clamp(20px, 4.6vmin, 42px);
           letter-spacing: .55em; margin-right: -.55em;
           animation: vc-track 2.2s cubic-bezier(.16, 1, .3, 1) .3s forwards; }
@keyframes vc-track { to { letter-spacing: .2em; margin-right: -.2em; } }
.vc-word span { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(18px) scale(1.15);
                animation: vc-letter 1s cubic-bezier(.16, 1, .3, 1) forwards;
                animation-delay: calc(.55s + var(--i) * .09s); }
@keyframes vc-letter { to { opacity: 1; filter: blur(0); transform: none; } }

.vc-count { position: absolute; left: 50%; bottom: 9vh; translate: -50% 0; opacity: .55;
            font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .3em; }
.vc-skip { position: absolute; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
           padding: 7px 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .25);
           background: transparent; color: #fff; font-size: 12px; cursor: pointer; opacity: .7; }
.vc-flare { position: fixed; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
            z-index: 2147483601; pointer-events: none;
            background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent);
            box-shadow: 0 0 40px 10px rgb(124 108 255 / .6); }

/* ───────────── 2 · AMBIENT LAYERS ───────────── */
.vc-field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }
.vc-aurora {
  position: fixed; inset: -20%; z-index: -1; pointer-events: none; opacity: .5;
  background:
    radial-gradient(40% 35% at 20% 30%, color-mix(in srgb, var(--vc-a) 35%, transparent), transparent 70%),
    radial-gradient(35% 40% at 80% 25%, color-mix(in srgb, var(--vc-b) 28%, transparent), transparent 70%),
    radial-gradient(45% 40% at 55% 85%, color-mix(in srgb, var(--vc-c) 24%, transparent), transparent 70%);
  animation: vc-drift 26s ease-in-out infinite alternate;
}
@keyframes vc-drift { to { translate: 4% -3%; scale: 1.12; rotate: 6deg; } }

.vc-grain {
  position: fixed; inset: -50%; z-index: 2147483300; pointer-events: none; opacity: .06;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: vc-grain 1s steps(6) infinite;
}
@keyframes vc-grain {
  0%, 100% { translate: 0 0; } 20% { translate: -4% 3%; } 40% { translate: 3% -5%; }
  60% { translate: -6% -2%; } 80% { translate: 5% 4%; }
}
.vc-progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 2147483200;
               pointer-events: none; transform-origin: 0 50%; transform: scaleX(0);
               background: linear-gradient(90deg, var(--vc-a), var(--vc-b), var(--vc-c)); }

/* ───────────── 3 · CURSOR ───────────── */
.vc-cursor, .vc-dot { position: fixed; left: 0; top: 0; z-index: 2147483400; pointer-events: none;
                      mix-blend-mode: difference; opacity: 0; transition: opacity .3s; }
.vc-cursor { width: 38px; height: 38px; margin: -19px 0 0 -19px; border: 1.5px solid #fff; border-radius: 50%; }
.vc-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #fff; border-radius: 50%; }

/* ───────────── 4 · ROUTE CURTAIN ───────────── */
.vc-curtain {
  position: fixed; inset: 0; z-index: 2147483500; pointer-events: none; visibility: hidden;
  transform: translate3d(0, 100%, 0);
  background: radial-gradient(60% 50% at 50% 100%, color-mix(in srgb, var(--vc-a) 45%, #07070b), #06060a 70%);
}
.vc-curtain::before, .vc-curtain::after {
  content: ""; position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #fff, transparent);
  box-shadow: 0 0 30px 6px color-mix(in srgb, var(--vc-b) 60%, transparent);
}
.vc-curtain::after { top: 0; }
.vc-curtain::before { bottom: 0; }

/* ───────────── 5 · GLITCH ───────────── */
.vc-glitch { animation: vc-glitch .55s steps(1, end) 1; }
@keyframes vc-glitch {
  0%   { text-shadow: 2px 0 var(--vc-b), -2px 0 var(--vc-c); translate: -2px 0; }
  20%  { text-shadow: -3px 0 var(--vc-b), 3px 0 var(--vc-c); translate: 3px 0; clip-path: inset(10% 0 55% 0); }
  40%  { text-shadow: 3px 1px var(--vc-b), -3px -1px var(--vc-c); translate: -3px 0; clip-path: inset(55% 0 10% 0); }
  60%  { text-shadow: -2px 0 var(--vc-b), 2px 0 var(--vc-c); translate: 2px 0; clip-path: none; }
  80%  { text-shadow: 1px 0 var(--vc-b), -1px 0 var(--vc-c); translate: 0 0; }
  100% { text-shadow: none; translate: 0 0; }
}

/* Admin route stays clean and fast */
.vc-admin :is(.vc-field, .vc-aurora, .vc-grain, .vc-progress, .vc-cursor, .vc-dot) { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .vc-aurora, .vc-grain, .vc-glitch { animation: none !important; }
}

</style>

<!-- HEADER -->
<header class="sticky top-0 z-30 border-b" style="background:var(--card);border-color:var(--bd);top:0">
 <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
  <a href="#home" onclick="go('home')" class="text-2xl font-extrabold tracking-tight" style="color:var(--ac)">Velora</a>
  <nav class="hidden md:flex gap-5 ml-6 text-sm font-medium">
   <a href="#home" onclick="go('home')">Home</a><a href="#shop" onclick="go('shop')">Shop</a><a href="#orders" onclick="go('orders')">Orders</a>
  </nav>
  <input id="q" oninput="onSearch(this.value)" placeholder="Search products, tags…" class="inp ml-auto max-w-xs">
  <button onclick="toggleTheme()" class="ghost btn px-3" aria-label="Theme">◐</button>
  <button onclick="drawer(true)" class="btn relative">Cart <span id="cc" class="ml-1 bg-white/25 rounded-full px-2 text-xs">0</span></button>
 </div>
 <nav class="md:hidden flex gap-5 px-4 pb-2 text-sm font-medium"><a href="#home" onclick="go('home')">Home</a><a href="#shop" onclick="go('shop')">Shop</a><a href="#orders" onclick="go('orders')">Orders</a></nav>
</header>

<aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md z-50 translate-x-full flex flex-col" style="background:var(--card)">
 <div class="p-4 border-b flex justify-between items-center" style="border-color:var(--bd)"><b class="text-lg">Your Cart</b><button onclick="drawer(false)" class="text-2xl">×</button></div>
 <div id="dbody" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

</aside>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white px-4 py-2 rounded-full text-sm hidden"></div>

};

/* ===== ROUTER & ADMIN GATE ===== */
function go(n,a=null){
 if(n==='admin'){renderAdmin();return;}
 view={n,a};try{location.hash=n==='pdp'?'p'+a:n}catch(e){}drawer(false);render();scrollTo(0,0)
}

function fromHash(){
 const h=(location.hash||'').slice(1);
 if(h.startsWith('admin-velorasecure999')){
  if(sessionStorage.getItem('velora_admin_auth')==='true'){
   view={n:'admin',a:null}; renderAdmin();
  } else {
   view={n:'admin_login',a:null}; renderAdminLogin();
  }
 } else if(/^p\d+$/.test(h)){
  view={n:'pdp',a:+h.slice(1)}; render();
 } else if(/^success-/.test(h)){
  view={n:'success',a:h.replace('success-','')}; render();
 } else if(['home','shop','checkout','orders'].includes(h)){
  view={n:h,a:null}; render();
 } else {
  view={n:'home',a:null}; render();
 }
}
addEventListener('hashchange',()=>{fromHash()});
function render(){
 if(view.n==='admin'||view.n==='admin_login')return;
 ({home:vHome,shop:vShop,pdp:vPdp,checkout:vCheckout,success:()=>vSuccess(view.a),orders:vOrders})[view.n]();
}

/* ===== COMPONENTS ===== */
const tile=(p,cls='h-44',big=false,ang=135)=>{
 const[a,b]=GRAD[p.c]||['#6366f1','#22d3ee'];
 if(p.img && p.img.trim()!==''){
  return `<div class="${cls} rounded-xl overflow-hidden flex items-center justify-center bg-gray-100"><img src="${p.img}" alt="${p.n}" class="w-full h-full object-cover" style="object-position:50% 25%"></div>`;
 }
 return `<div class="${cls} rounded-xl flex items-center justify-center ${big?'text-8xl':'text-6xl'}" style="background:linear-gradient(${ang}deg,${a},${b})">${p.e||'📦'}</div>`;
};
const stars=r=>`<span class="text-amber-500">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}</span> <span class="text-xs mut">${r.toFixed(1)}</span>`;
const stockTag=p=>p.stock===0?'<span class="text-red-600 text-sm">Out of stock</span>':p.stock<=5?`<span class="text-amber-600 text-sm">Only ${p.stock} left</span>`:'<span class="text-sm" style="color:var(--ac)">In stock</span>';
const cardHtml=p=>`<div class="card hv p-3 flex flex-col"><div class="cursor-pointer" onclick="go('pdp',${p.id})">${tile(p)}<div class="mt-3 text-xs mut">${p.c}</div><div class="font-semibold leading-tight">${p.n}</div><div class="mt-1">${stars(p.r)}</div></div>
<div class="mt-auto pt-3 flex items-center justify-between"><b>${fmt(p.p)}</b><button class="btn text-sm" ${p.stock?'':'disabled style="opacity:.4"'} onclick="quickAdd(${p.id})">+ Add</button></div></div>`;

function vHome(){

 $('#app').innerHTML=`
 ${cineHtml()}
 <h2 class="text-xl font-bold mt-10 mb-4">Categories</h2>
 <div class="grid grid-cols-2 md:grid-cols-6 gap-3">${CATS.filter(c=>P.some(p=>p.c===c)).map(c=>`<button onclick="F.cat='${c}';go('shop')" class="card hv p-4 text-center"><div class="h-14 rounded-lg mb-2" style="background:linear-gradient(135deg,${GRAD[c][0]},${GRAD[c][1]})"></div><b class="text-sm">${c}</b></button>`).join('')}</div>
 <h2 class="text-xl font-bold mt-10 mb-4">Featured products</h2>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-4">${feat.map(cardHtml).join('')}</div>`;
}

function filtered(){
 const q=F.q.toLowerCase().trim();
 let r=P.filter(p=>(F.cat==='All'||p.c===F.cat)&&p.p>=F.min&&p.p<=F.max&&p.r>=F.rate&&(!q||(p.n+p.d+p.t.join(' ')+p.c).toLowerCase().includes(q)));
 const s={lh:(a,b)=>a.p-b.p,hl:(a,b)=>b.p-a.p,new:(a,b)=>b.id-a.id,best:(a,b)=>b.sold-a.sold,feat:(a,b)=>b.r-a.r}[F.sort];
 return r.sort(s);
}
function vShop(){
 $('#app').innerHTML=`<div class="grid md:grid-cols-[250px_1fr] gap-6">
 <aside class="card p-4 h-fit space-y-5 text-sm">
  <div><b>Category</b><div class="mt-2 flex flex-wrap gap-2">${['All',...CATS.filter(c=>P.some(p=>p.c===c))].map(c=>`<span class="chip ${F.cat===c?'on':''}" onclick="F.cat='${c}';vShop()">${c}</span>`).join('')}</div></div>
  <div><b>Price range</b><div class="mt-2 mut" id="pl">${fmt(F.min)} – ${fmt(F.max)}</div>
   <input type="range" min="0" max="20000" step="100" value="${F.min}" oninput="F.min=Math.min(+this.value,F.max);pl()" class="w-full accent-indigo-600">

  <select class="inp !w-auto" onchange="F.sort=this.value;grid()">${[['feat','Featured'],['lh','Price: Low to High'],['hl','Price: High to Low'],['new','Newest Arrivals'],['best','Best Sellers']].map(([v,l])=>`<option value="${v}" ${F.sort===v?'selected':''}>${l}</option>`).join('')}</select></div>

const pl=()=>{$('#pl').textContent=fmt(F.min)+' – '+fmt(F.max);grid()};
function grid(){const r=filtered();$('#rc').textContent=r.length+' products';$('#grid').innerHTML=r.length?r.map(cardHtml).join(''):'<p class="mut col-span-full py-12 text-center">No products match your filters.</p>'}

let npImg='';
function pickImg(inp){
 const f=inp.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  npImg=c.toDataURL('image/jpeg',.8);const pv=$('#np_prev');pv.src=npImg;pv.classList.remove('hidden');toast('Photo ready');
 };im.src=rd.result};
 rd.readAsDataURL(f);
}

function addProduct(){
 const g=id=>$('#'+id).value.trim(), clean=s=>s.replace(/[<>"]/g,'');
 const n=clean(g('np_n')), c=g('np_c'), p=+g('np_p'), s=g('np_s')===''?15:+g('np_s'), r=g('np_r')===''?4:+g('np_r');
 const img=clean(g('np_i')), e=clean(g('np_e'))||'📦', bad=[];
 if(n.length<2)bad.push('np_n');
 if(!(p>0))bad.push('np_p');
 if(!Number.isInteger(s)||s<0)bad.push('np_s');
 if(!(r>=0&&r<=5))bad.push('np_r');
 if(img&&!/^https?:\/\//i.test(img))bad.push('np_i');
 document.querySelectorAll('#atab .inp.bad').forEach(x=>x.classList.remove('bad'));
 if(bad.length){bad.forEach(id=>$('#'+id).classList.add('bad'));toast('Please correct the highlighted fields');return;}
 if(P.some(x=>x.n.toLowerCase()===n.toLowerCase())){$('#np_n').classList.add('bad');toast('A product with this name already exists');return;}
 P.push({
  id:Math.max(0,...P.map(x=>x.id))+1, n, c, p:Math.round(p), r, e,
  t:clean(g('np_t')).split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),
  sold:0, rv:0, stock:s, sizes:SIZED(c)?SZ:null,

    addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      x = e.clientX; y = e.clientY;
      if (!on) { on = true; rx = x; ry = y; ring.style.opacity = dot.style.opacity = 1; }
      ts = e.target.closest && e.target.closest('a, button, [role="button"], input, select, textarea, .vm-card, [data-tilt]') ? 1.8 : 1;
    }, { passive: true });
    root.addEventListener('pointerleave', () => { on = false; ring.style.opacity = dot.style.opacity = 0; });
    (function f() {
      raf(f); if (!on) return;
      rx = lerp(rx, x, .18); ry = lerp(ry, y, .18); s = lerp(s, ts, .15);
      ring.style.transform = `translate3d(${rx}px,${ry}px,0) scale(${s.toFixed(3)})`;
      dot.style.transform = `translate3d(${x}px,${y}px,0)`;
    })();
  }

  /* ───────── 5 · ROUTE CURTAIN (replays your own click after the cover) ───────── */
  function glitch(el) {
    if (!el || reduce) return;
    el.classList.remove('vc-glitch'); void el.offsetWidth; el.classList.add('vc-glitch');
    el.addEventListener('animationend', () => el.classList.remove('vc-glitch'), { once: true });
  }
  function curtain() {
    const el = mk('div', 'vc-curtain'); el.setAttribute('aria-hidden', 'true'); root.appendChild(el);
    let busy = false, bypass = false;
    const ok = a => { const h = a.getAttribute('href') || ''; return /^#[a-z][\w-]*$/i.test(h) && !/^#admin/i.test(h) && h !== location.hash && !a.closest('.vm-drawer'); };
    const ease = 'cubic-bezier(.7,0,.2,1)';
    d.addEventListener('click', e => {
      if (bypass || busy || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a || !ok(a)) return;
      e.preventDefault(); e.stopImmediatePropagation(); busy = true; el.style.visibility = 'visible';
      el.animate([{ transform: 'translate3d(0,100%,0)' }, { transform: 'translate3d(0,0,0)' }], { duration: 380, easing: ease, fill: 'forwards' }).onfinish = () => {
        bypass = true; a.click(); bypass = false;
        setTimeout(() => {
          el.animate([{ transform: 'translate3d(0,0,0)' }, { transform: 'translate3d(0,-100%,0)' }], { duration: 620, easing: ease, fill: 'forwards' }).onfinish = () => {
            el.getAnimations().forEach(x => x.cancel()); el.style.visibility = 'hidden'; busy = false;
          };
        }, 140);
      };
    }, true);
  }

  /* ───────── 6 · DECODE headings · COUNT-UP prices ───────── */
  const GL = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+';
  function decode(el) {
    const tn = el.childNodes.length === 1 && el.firstChild.nodeType === 3 ? el.firstChild : null; if (!tn) return;
    const fin = tn.nodeValue; if (fin.trim().length < 3 || fin.length > 70) return;
    el.style.minHeight = el.offsetHeight + 'px'; el.setAttribute('aria-label', fin.trim());
    const t0 = performance.now(), dur = 650 + fin.length * 14;
    (function f(now) {
      const u = clamp((now - t0) / dur, 0, 1), k = Math.floor(u * fin.length);
      tn.nodeValue = u < 1 ? fin.replace(/\S/g, (c, i) => i < k ? c : GL[(Math.random() * GL.length) | 0]) : fin;
      if (u < 1) raf(f); else { el.style.minHeight = ''; el.removeAttribute('aria-label'); }
    })(t0);
  }
  const PRICE = /^(\s*(?:Rs\.?|PKR|₨|\$|€|£)?\s*)(\d[\d,]*(?:\.\d+)?)(\s*)$/i;
  function countUp(card) {
    $$('*', card).filter(e => !e.children.length && PRICE.test(e.textContent)).forEach(e => {
      const tn = e.firstChild; if (!tn || tn.nodeType !== 3) return;
      const m = e.textContent.match(PRICE), target = parseFloat(m[2].replace(/,/g, '')); if (!(target > 0)) return;
      const dec = (m[2].split('.')[1] || '').length, comma = m[2].includes(','), t0 = performance.now();
      (function f(now) {
        const u = easeOut(clamp((now - t0) / 900, 0, 1)), v = target * u;
        tn.nodeValue = m[1] + (comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec)) + m[3];
        if (u < 1) raf(f);
      })(t0);
    });
  }
  const kinds = new WeakMap();
  const kio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; kio.unobserve(e.target);
    const k = kinds.get(e.target), go = () => (k === 'h' ? setTimeout(() => decode(e.target), 180) : countUp(e.target));
    waitIntro ? waitIntro.then(go) : go();
  }), { threshold: .35 });
  function regTargets() {
    const skip = '.vm-drawer, .vc-intro-layer, header, footer';
    if (CFG.decode) $$('h2').forEach(h => { if (!kinds.has(h) && !h.closest(skip + ', .vm-card')) { kinds.set(h, 'h'); kio.observe(h); } });
    if (CFG.countUp) $$(CFG.cards).forEach(c => { if (!kinds.has(c) && !c.closest(skip)) { kinds.set(c, 'c'); kio.observe(c); } });
  }

  /* ───────── boot ───────── */
  function boot() {
    hideLegacy(); setTimeout(hideLegacy, 150); setTimeout(hideLegacy, 700);
    const adm = () => root.classList.toggle('vc-admin', isAdmin()); adm(); addEventListener('hashchange', adm);
    if (reduce) { root.classList.remove('vc-pre'); return; }

    if (CFG.intro && !isAdmin()) { waitIntro = intro(); window.__vcWait = waitIntro; } else root.classList.remove('vc-pre');

    if (CFG.aurora) root.appendChild(mk('div', 'vc-aurora'));
    if (CFG.grain) root.appendChild(mk('div', 'vc-grain'));
    if (CFG.field) field();
    if (CFG.cursor && fine) cursor();
    if (CFG.curtain) curtain();
    const scanTilt = CFG.tilt ? tilt() : () => {};

    if (CFG.progress) {
      const bar = mk('div', 'vc-progress'); root.appendChild(bar); let pt = 0;
      const upd = () => { pt = 0; const h = root.scrollHeight - innerHeight; bar.style.transform = `scaleX(${h > 0 ? clamp(scrollY / h, 0, 1) : 0})`; };
      addEventListener('scroll', () => { if (!pt) { pt = 1; raf(upd); } }, { passive: true }); upd();
    }
    if (CFG.glitch && fine) {
      d.addEventListener('pointerover', e => {
        const t = e.target.closest && e.target.closest('header a, nav a, h1');
        if (t && !t.contains(e.relatedTarget)) glitch(t);
      });
      addEventListener('hashchange', () => setTimeout(() => glitch($$('h1').find(h => h.getBoundingClientRect().height > 0)), 450));
    }

    let q = 0; const rescan = () => { q = 0; scanTilt(); regTargets(); };
    new MutationObserver(() => { if (!q) { q = 1; raf(rescan); } }).observe(d.body, { childList: true, subtree: true });
    rescan();
  }

  window.VeloraCinema = { replay: () => { waitIntro = intro(); window.__vcWait = waitIntro; return waitIntro; }, glitch };
  d.readyState === 'loading' ? d.addEventListener('DOMContentLoaded', boot, { once: true }) : boot();
})();

</script>
